name: C/C++ CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'

permissions:
  contents: read
  pull-requests: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

  # The minus sign removes the trailing new line in the last line
  cmake_ubuntu_deps: |-
    binutils-dev \
    build-essential \
    ccache \
    cmake \
    gettext \
    libboost-all-dev \
    libcrypto++-dev \
    libgd-dev \
    libglib2.0-dev \
    libmaxminddb-dev \
    libreadline-dev \
    libupnp-dev \
    libwxgtk3.2-dev \
    pkg-config \
    wx3.2-headers

  cmake_macos_deps: |-
    boost \
    ccache \
    cryptopp \
    gd \
    gettext \
    libmaxminddb \
    libupnp \
    pkg-config \
    wxwidgets

  cmake_mingw_w64_deps: |
    mingw-w64-x86_64-boost
    mingw-w64-x86_64-ccache
    mingw-w64-x86_64-cmake
    mingw-w64-x86_64-crypto++
    mingw-w64-x86_64-gettext
    mingw-w64-x86_64-libgd
    mingw-w64-x86_64-libmaxminddb
    mingw-w64-x86_64-ninja
    mingw-w64-x86_64-pkgconf
    mingw-w64-x86_64-pupnp
    mingw-w64-x86_64-readline
    mingw-w64-x86_64-toolchain
    mingw-w64-x86_64-wxwidgets3.2-msw
    mingw-w64-x86_64-zlib

  cmake_common_config_flags: |-
    -B build \
    -DBUILD_ALC=YES \
    -DBUILD_ALCC=YES \
    -DBUILD_AMULECMD=YES \
    -DBUILD_CAS=YES \
    -DBUILD_DAEMON=YES \
    -DBUILD_WXCAS=YES \
    -DBUILD_ED2K=YES \
    -DBUILD_MONOLITHIC=YES \
    -DBUILD_REMOTEGUI=YES \
    -DBUILD_TESTING=YES \
    -DBUILD_WEBSERVER=YES \
    -DENABLE_NLS=YES \
    -DENABLE_UPNP=YES

  cmake_ubuntu_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  # ENABLE_NLS will be auto-disabled by cmake/nls.cmake: argz.h is
  #   a glibc-only header and isn't provided by macOS or Homebrew
  cmake_macos_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  cmake_mingw_w64_config_flags: |-
    -G Ninja \
    -DENABLE_IP2COUNTRY=YES

  ctest_flags: |-
    --test-dir build \
    --output-on-failure \
    --timeout 10

jobs:
  build_cmake_ubuntu:
    name: Build CMake Ubuntu (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }}
      # It seems to run faster without this, but we have to manually list the
      # dependencies abobe.
      #  run: |
      #    sudo apt-get install devscripts equivs && sudo mk-build-deps -i
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  build_cmake_macos:
    name: Build CMake MacOS (${{ matrix.build_type }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          brew update
          brew install ${{ env.cmake_macos_deps }}
          # Homebrew installs into /opt/homebrew on Apple Silicon — not a
          # default compiler/linker/pkg-config search path. aMule's custom
          # cmake/cryptopp.cmake uses check_include_file_cxx which does NOT
          # honour CMAKE_PREFIX_PATH, so export CPATH/LIBRARY_PATH directly.
          BREW_PREFIX=$(brew --prefix)
          echo "CPATH=$BREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$(brew --prefix gd)/lib/pkgconfig:$(brew --prefix libupnp)/lib/pkgconfig:$(brew --prefix gettext)/lib/pkgconfig" >> "$GITHUB_ENV"
          # gettext is keg-only on macOS; add msgfmt to PATH for NLS probe
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_macos_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  build_cmake_windows_mingw_w64:
    name: Build CMake mingw-w64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: set up MSYS2 mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: ${{ env.cmake_mingw_w64_deps }}
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_mingw_w64_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  # 32-bit Linux: build wx 3.2 from source SHARED (+libcurl for wxWebRequest;
  # Debian ships wx with it off). Proven 32-bit-clean — no aMule changes.
  # wx install + ccache live under the workspace so actions/cache can persist
  # them across runs (the build runs inside a 32-bit docker container).
  build_cmake_linux_i386:
    name: Build CMake Linux i386 (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: cache wx (i386)
        uses: actions/cache@v6
        with:
          path: wx-i386
          key: wx-i386-3.2.6
      - name: cache ccache (i386)
        uses: actions/cache@v6
        with:
          path: .ccache-i386
          key: i386-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: i386-${{ matrix.build_type }}-ccache-
      - name: i386 build + tests
        run: |
          docker run --rm --platform linux/386 \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -e WX_PREFIX=/src/wx-i386 -e CCACHE_DIR=/src/.ccache-i386 \
            -v "$PWD":/src -w /src i386/debian:bookworm bash -euxc "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: &script |
            export CCACHE_MAXSIZE=500M
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              build-essential ccache cmake gettext pkg-config binutils-dev \
              wget ca-certificates bzip2 libgtk-3-dev libcurl4-openssl-dev \
              libboost-all-dev libcrypto++-dev libgd-dev libupnp-dev \
              libmaxminddb-dev libreadline-dev libglib2.0-dev libatomic1 >/dev/null
            if [ ! -x "$WX_PREFIX/bin/wx-config" ]; then
              cd /tmp
              wget -q https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6.tar.bz2
              tar xf wxWidgets-3.2.6.tar.bz2 && cd wxWidgets-3.2.6
              ./configure --with-gtk=3 --enable-webrequest --prefix="$WX_PREFIX"
              make -j"$(nproc)" && make install
            fi
            export LD_LIBRARY_PATH="$WX_PREFIX/lib:${LD_LIBRARY_PATH:-}"
            cd /src
            ccache --zero-stats || true
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DwxWidgets_CONFIG_EXECUTABLE="$WX_PREFIX/bin/wx-config" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DBUILD_MONOLITHIC=YES -DBUILD_DAEMON=YES -DBUILD_AMULECMD=YES \
              -DBUILD_WEBSERVER=YES -DBUILD_REMOTEGUI=YES -DBUILD_ED2K=YES \
              -DBUILD_CAS=YES -DBUILD_WXCAS=YES -DBUILD_ALC=YES -DBUILD_ALCC=YES \
              -DBUILD_TESTING=YES -DENABLE_NLS=YES -DENABLE_UPNP=YES -DENABLE_IP2COUNTRY=YES
            cmake --build build -j"$(nproc)"
            ccache --show-stats || true
            ctest --test-dir build --output-on-failure --timeout 30

  build_cmake_linux_armhf:
    name: Build CMake Linux armhf (${{ matrix.build_type }}) [qemu]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - name: cache wx (armhf)
        uses: actions/cache@v6
        with:
          path: wx-armhf
          key: wx-armhf-3.2.6
      - name: cache ccache (armhf)
        uses: actions/cache@v6
        with:
          path: .ccache-armhf
          key: armhf-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: armhf-${{ matrix.build_type }}-ccache-
      - name: armhf full build + tests (emulated)
        run: |
          docker run --rm --platform linux/arm/v7 \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -e WX_PREFIX=/src/wx-armhf -e CCACHE_DIR=/src/.ccache-armhf \
            -v "$PWD":/src -w /src arm32v7/debian:bookworm bash -euxc "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: *script
